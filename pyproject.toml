[project]
name = "anylist-mcp"
version = "1.1.0"
description = "Connect AnyList to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No AnyList API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["anylist", "anylist api", "anylist mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/anylist-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=anylist"
Source = "https://github.com/cotlet-connect/anylist-mcp"

[project.scripts]
anylist-mcp = "anylist_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"anylist_agent.py" = "anylist_agent.py"

[tool.hatch.build.targets.sdist]
include = ["anylist_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
